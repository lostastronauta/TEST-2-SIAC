<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Denuncia - Paso 2 - Identificación de la materia</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../css/site.css">
    <link rel="stylesheet" href="../css/internal.css">
</head>
<body>
    <div id="header-container"></div>
    <main class="container">
        <div class="stepper">
            <div class="step-item completed"><div class="step-circle">1</div><div class="step-label">Relato</div></div>
            <div class="step-item active"><div class="step-circle">2</div><div class="step-label">Identificación</div></div>
            <div class="step-item"><div class="step-circle">3</div><div class="step-label">Afectado</div></div>
            <div class="step-item"><div class="step-circle">4</div><div class="step-label">Establecimiento</div></div>
            <div class="step-item"><div class="step-circle">5</div><div class="step-label">Confirmación</div></div>
        </div>

        <h2>Paso 2: Identificación de la materia</h2>
        <p>Completa la información sobre la materia o asunto relacionado con la denuncia.</p>

        <form id="formPaso2" novalidate>
            <div class="form-group">
                <label for="materia">Materia o asunto <span style="color:#b32">*</span></label>
                <input id="materia" name="materia" class="form-control" style="width:100%;padding:10px;border:1px solid #ddd;border-radius:6px" placeholder="Ej: Atención pedagógica, infraestructura, convivencia" required>
                <div class="field-error" id="errMateria">Este campo es obligatorio.</div>
            </div>

            <div class="actions">
                <a href="denuncia.html" class="btn btn-secondary">Volver</a>
                <button class="btn btn-primary" id="btnSiguiente2" type="submit">Siguiente</button>
            </div>
        </form>
    </main>

    <script>
        // Cargar valores previos si existen
        var saved = sessionStorage.getItem('denunciaPaso2');
        if (saved) {
            try { var obj = JSON.parse(saved); if (obj.materia) document.getElementById('materia').value = obj.materia; } catch(e){}
        }

        var formPaso2El = document.getElementById('formPaso2'); if (formPaso2El) formPaso2El.addEventListener('submit', function(e){
            e.preventDefault();
            var materia = document.getElementById('materia').value.trim();
            var err = document.getElementById('errMateria');
            if (!materia) { err.classList.add('visible'); document.getElementById('materia').focus(); return; }
            if (err) err.classList.remove('visible');
            sessionStorage.setItem('denunciaPaso2', JSON.stringify({ materia: materia }));
            window.location.href = 'denuncia-paso3.html';
        });
    </script>

    <div id="footer-container"></div>
    <script src="../js/components.js" defer></script>
</body>
</html>
