<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Denuncia - Paso 3 - Identificación de afectado</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../css/site.css">
    <link rel="stylesheet" href="../css/internal.css">
</head>
<body>
    <div id="header-container"></div>
    <main class="container">
        <div class="stepper">
            <div class="step-item completed"><div class="step-circle">1</div><div class="step-label">Relato</div></div>
            <div class="step-item completed"><div class="step-circle">2</div><div class="step-label">Identificación</div></div>
            <div class="step-item active"><div class="step-circle">3</div><div class="step-label">Afectado</div></div>
            <div class="step-item"><div class="step-circle">4</div><div class="step-label">Establecimiento</div></div>
            <div class="step-item"><div class="step-circle">5</div><div class="step-label">Confirmación</div></div>
        </div>

        <h2>Paso 3: Identificación de afectado</h2>
        <p>Indica quiénes son las personas afectadas por la situación (puedes poner nombres o descripciones).</p>

        <form id="formPaso3" novalidate>
            <div class="form-group">
                <label for="afectado">Nombre o descripción del afectado <span style="color:#b32">*</span></label>
                <input id="afectado" name="afectado" class="form-control" style="width:100%;padding:10px;border:1px solid #ddd;border-radius:6px" placeholder="Ej: Estudiante X, Apoderado Y, Docente Z" required>
                <div class="field-error" id="errAfectado">Este campo es obligatorio.</div>
            </div>

            <div class="actions">
                <a href="denuncia-paso2.html" class="btn btn-secondary">Volver</a>
                <button class="btn btn-primary" id="btnSiguiente3" type="submit">Siguiente</button>
            </div>
        </form>
    </main>

    <script>
        var saved = sessionStorage.getItem('denunciaPaso3');
        if (saved) { try { var obj = JSON.parse(saved); if (obj.afectado) document.getElementById('afectado').value = obj.afectado; } catch(e){} }

        var formPaso3El = document.getElementById('formPaso3'); if (formPaso3El) formPaso3El.addEventListener('submit', function(e){
            e.preventDefault();
            var afectado = document.getElementById('afectado').value.trim();
            var err = document.getElementById('errAfectado');
            if (!afectado) { err.classList.add('visible'); document.getElementById('afectado').focus(); return; }
            if (err) err.classList.remove('visible');
            sessionStorage.setItem('denunciaPaso3', JSON.stringify({ afectado: afectado }));
            window.location.href = 'denuncia-paso4.html';
        });
    </script>

    <div id="footer-container"></div>
    <script src="../js/components.js?v=20260828" defer></script>
</body>
</html>
